name: Deplyze

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so newly published advisories are caught even without a commit.
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  deplyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: deplyze/deplyze/action@v1
        with:
          fail-on: high
          format: sarif
          output: deplyze.sarif
