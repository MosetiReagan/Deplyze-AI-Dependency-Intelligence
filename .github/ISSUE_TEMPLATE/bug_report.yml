name: Bug report
description: Something in Deplyze does not behave as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Do not report security vulnerabilities here** — see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Deplyze version
      description: Output of `deplyze version`.
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node --version`.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Linux, macOS, Windows, Other]
    validations:
      required: true
  - type: dropdown
    id: manager
    attributes:
      label: Package manager of the scanned project
      options: [npm, pnpm, yarn, bun, other]
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command run
      description: The exact command, including flags.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include output. Re-run with `--debug` for a stack trace. Redact anything sensitive.
      render: shell
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: A link to a repo or the smallest package.json/lockfile that reproduces it.
    validations:
      required: false
