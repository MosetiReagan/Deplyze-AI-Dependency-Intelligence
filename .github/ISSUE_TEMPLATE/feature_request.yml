name: Feature request
description: Suggest a capability, report format, detector or ecosystem adapter.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the gap in your workflow, not just the feature you want.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Ecosystem adapter
        - Scanner / detector
        - Risk scoring
        - Reports / output format
        - CLI
        - MCP / AI agent integration
        - Configuration / policy
        - Documentation
        - Other
    validations:
      required: true
