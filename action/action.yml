name: 'Deplyze'
description: 'Dependency intelligence and software supply-chain analysis with SARIF output for GitHub code scanning.'
author: 'Deplyze'

branding:
  icon: 'shield'
  color: 'purple'

inputs:
  path:
    description: 'Project directory to analyse.'
    required: false
    default: '.'
  fail-on:
    description: 'Severity threshold that fails the job: critical, high, medium, low, info (space separated).'
    required: false
    default: 'high'
  format:
    description: 'Report format: terminal, json, markdown or sarif.'
    required: false
    default: 'sarif'
  output:
    description: 'Report output path, relative to the project root.'
    required: false
    default: 'deplyze.sarif'
  version:
    description: 'Deplyze version to install (npm dist-tag or exact version).'
    required: false
    default: 'latest'
  upload-sarif:
    description: 'Upload the SARIF report to GitHub code scanning. Requires the security-events: write permission.'
    required: false
    default: 'true'
  args:
    description: 'Additional arguments passed to `deplyze ci`.'
    required: false
    default: ''

outputs:
  exit-code:
    description: 'Deplyze exit code: 0 pass, 1 policy violation, 2 error.'
    value: ${{ steps.scan.outputs.exit-code }}

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Cache npm
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: deplyze-${{ runner.os }}-${{ hashFiles('**/package-lock.json', '**/pnpm-lock.yaml', '**/yarn.lock') }}
        restore-keys: deplyze-${{ runner.os }}-

    - name: Install Deplyze
      shell: bash
      run: npm install --global --no-fund --no-audit deplyze@${{ inputs.version }}

    - name: Run Deplyze CI
      id: scan
      shell: bash
      # `set +e` keeps the action running so the SARIF upload still happens; the
      # exit code is captured and re-applied at the end.
      run: |
        set +e
        deplyze ci \
          --path "${{ inputs.path }}" \
          --format "${{ inputs.format }}" \
          --fail-on ${{ inputs.fail-on }} \
          --output "${{ inputs.output }}" \
          ${{ inputs.args }}
        code=$?
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        exit 0

    - name: Upload SARIF to code scanning
      if: ${{ always() && inputs.upload-sarif == 'true' && inputs.format == 'sarif' }}
      uses: github/codeql-action/upload-sarif@v3
      continue-on-error: true
      with:
        sarif_file: ${{ inputs.path }}/${{ inputs.output }}
        category: deplyze

    - name: Fail if Deplyze reported a violation
      if: ${{ steps.scan.outputs.exit-code != '0' }}
      shell: bash
      run: |
        echo "Deplyze exited with code ${{ steps.scan.outputs.exit-code }} (1 = policy violation, 2 = error)."
        exit 1
